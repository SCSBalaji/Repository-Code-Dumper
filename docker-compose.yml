# Docker Compose for Repository Code Dumper
# Full-stack deployment with frontend and backend

version: '3.8'

services:
  # Backend API Service
  backend:
    build: ./backend
    container_name: repo-dumper-backend
    ports:
      - "8000:8000"
    environment:
      - OUTPUT_DIR=/app/outputs
      - PYTHONUNBUFFERED=1
    volumes:
      - output_files:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=
    container_name: repo-dumper-frontend
    ports:
      - "3300:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  output_files:
    driver: local
